# Dual-host + WebSocket for andreybolotov.ru and my.andreybolotov.ru
#
# Вставьте/смержите в существующий server { } на проде (обычно
# /etc/nginx/sites-available/andreybolotov.ru), затем:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Beeline CDN (my.) тянет origin с Hostname=andreybolotov.ru.
# Пользователи также могут открывать apex напрямую.

server_name andreybolotov.ru www.andreybolotov.ru my.andreybolotov.ru;

client_max_body_size 500M;
client_body_timeout 600s;

# WebSocket → Fastify (чат / публичные фиды). Обязательно для обоих хостов.
location /ws {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

