# Чувствительные загрузки: не отдавать напрямую с диска.
# Приложение (Fastify) само отдаёт /uploads/receipts и /uploads/chat
# только по подписанному URL или сессии владельца/админа.
#
# Деплой: include этого файла в server{} ПЕРЕД общим location /uploads/
# (или вместо него). Также подключите nginx-security-headers.conf.
# После правок: nginx -t && systemctl reload nginx; перезапуск Fastify + Next.

# Публичные медиа (обложки акций, блог) можно отдавать напрямую:
location ^~ /uploads/blog/ {
    include snippets/security-headers.conf; # или: include /path/to/nginx-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    alias /var/www/andreybolotov.ru/public/uploads/blog/; # поправьте путь
    try_files $uri =404;
}

location ^~ /uploads/raffles/ {
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    alias /var/www/andreybolotov.ru/public/uploads/raffles/;
    try_files $uri =404;
}

# Чеки и вложения чата — только через Node (проверка подписи/прав)
location ^~ /uploads/receipts/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    add_header Cache-Control "private, no-store" always;
}

location ^~ /uploads/chat/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    add_header Cache-Control "private, no-store" always;
}
