# Фрагмент для nginx: без этого загрузки > 1 МБ дают 413 Request Entity Too Large.
# Вставьте в server { } или в location, который проксирует на Next/Fastify.

client_max_body_size 500M;
client_body_timeout 600s;

# Таймауты прокси — иначе после 100% загрузки обрыв (видео 100+ МБ)
proxy_connect_timeout 60s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;

