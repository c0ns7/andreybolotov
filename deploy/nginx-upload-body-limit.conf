# Фрагмент для nginx: без этого загрузки > 1 МБ дают 413 Request Entity Too Large.
# Вставьте в server { } или в location, который проксирует на Next/Fastify.

client_max_body_size 50M;

# Пример location (подставьте свои upstream):
# location /api/ {
#   client_max_body_size 50M;
#   proxy_pass http://127.0.0.1:8787;
#   proxy_request_buffering off;
# }
#
# location / {
#   client_max_body_size 50M;
#   proxy_pass http://127.0.0.1:3000;
# }
